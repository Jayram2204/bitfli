[package]
name = "bitfli-pod-vault"
version = "0.1.0"
authors = ["bitfli.xyz <engineering@bitfli.xyz>"]
edition = "2021"
description = "Autonomous Cross-Border Micro-Agency & Profit-Split Vault Contract on NEAR Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "=5.6.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
